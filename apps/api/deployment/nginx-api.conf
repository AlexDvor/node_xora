# Included inside the existing Nginx server block listening on port 80.
location /api/ {
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.1.0/24;
    deny all;

    # No URI suffix: preserve /api/v1/... when forwarding to Fastify.
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
